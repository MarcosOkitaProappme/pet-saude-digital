<!--
  ============================================================================
  PET SAÚDE DIGITAL — SPA (React + Tailwind CSS)
  ============================================================================
  Este arquivo é a base de código pedida no planejamento: um único documento
  que roda direto no navegador (sem precisar de Node/npm), usando:
    - React 18 (UMD) + ReactDOM ......... biblioteca de componentes
    - Babel Standalone .................. compila o JSX no próprio navegador
    - Tailwind CSS (CDN) ................ utilitários de estilo

  Estrutura de pastas sugerida para portar isto a um projeto Vite/CRA real:
    src/
      App.jsx                 -> componente <App/> (estado das abas)
      components/
        Header.jsx             -> logo, menu de abas, CTA de inscrição
        About.jsx               -> <Sobre/>
        Schedule.jsx            -> <Programacao/>
        Speakers.jsx            -> <Palestrantes/>
        Submissions.jsx         -> <Submissao/>
        Location.jsx            -> <Local/>
        Sponsors.jsx            -> <Patrocinadores/>
        Contact.jsx             -> <Contato/>
        Footer.jsx              -> rodapé com logo da UEPA

  REGRA DE NEGÓCIO CENTRAL (definida pelo cliente, Prof. Anderson):
  o site é uma SPA de abas — o menu fica fixo, o conteúdo troca por
  renderização condicional via useState, e a página não deve exigir rolagem
  longa. Cada aba, internamente, pode ter um scroll próprio se o conteúdo
  não couber, mas a navegação entre seções nunca rola a página toda.

  DADOS: todos os nomes, textos, valores e contatos abaixo são FICTÍCIOS,
  gerados para fins de protótipo, conforme alinhado nas reuniões de
  levantamento de requisitos com o cliente.
  ============================================================================
-->

  const palestrante = item.palestranteId ? porId(item.palestranteId) : null;

  return (
    <li className="border border-slate-200 rounded-lg bg-white overflow-hidden">
      <button
        onClick={() => setAberto((v) => !v)}
        className="w-full flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-4 text-left px-4 py-3 hover:bg-pet-ice/60 transition-colors"
      >
        <span className="text-xs font-semibold text-pet-blue w-full sm:w-28 flex-none">
          {item.horario}
        </span>
        <span className="flex-1 text-sm font-medium text-pet-blueDark">{item.titulo}</span>
        <span className="text-xs text-slate-500 flex-none">
          {palestrante ? palestrante.nome.replace(/^Prof[ª.]?\.?\s?(Dr|Dra|Me|Ma)?\.?\s?/, "") : ""}
        </span>
        <span className="text-pet-orange text-xs font-bold flex-none">{aberto ? "–" : "+"}</span>
      </button>
      {aberto && (
        <div className="px-4 pb-4 pt-1 border-t border-slate-100 text-sm text-slate-600 space-y-1.5">
          {palestrante && (
            <p><strong className="text-pet-blueDark">Palestrante:</strong> {palestrante.nome} — {palestrante.instituicao}</p>
          )}
          <p><strong className="text-pet-blueDark">Local:</strong> {item.local}</p>
          <p>{item.detalhes}</p>
        </div>
      )}
    </li>
  );
}

            </ul>
          </div>
        ))}
      </div>
    </div>
  );
}

          >

        </div>

}

/* ============================================================================
   CTA DE INSCRIÇÃO — evento pago (R$ 15,00), redireciona para WhatsApp.
   Fica visível no cabeçalho em telas largas e como faixa fixa no rodapé em
   telas pequenas, para nunca depender de scroll para ser encontrado.
   ============================================================================ */

function InscricaoCTA({ className = "" }) {
  return (
    <a
      href={LINK_WHATSAPP_INSCRICAO}
      target="_blank"
      rel="noreferrer"
      className={`inline-flex items-center gap-2 bg-pet-orange hover:brightness-95 text-white text-sm font-semibold rounded-lg px-4 py-2.5 transition-colors whitespace-nowrap ${className}`}
    >
      Inscreva-se · {EVENTO.valorInscricao}
    </a>
  );
}

/* ============================================================================
   CABEÇALHO + MENU DE ABAS (fixo)
   ============================================================================ */

const ABAS = [
  { id: "sobre", label: "Sobre" },
  { id: "programacao", label: "Programação" },
  { id: "palestrantes", label: "Palestrantes" },
  { id: "submissao", label: "Submissão" },
  { id: "local", label: "Local" },
  { id: "patrocinadores", label: "Patrocinadores" },
  { id: "contato", label: "Contato" },
];

function Header({ abaAtiva, setAbaAtiva }) {
  return (
    <header className="sticky top-0 z-20 bg-pet-blue text-white shadow-sm">
      <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <div className="min-w-0">
          <p className="text-[15px] sm:text-base font-bold leading-none tracking-tight truncate">
            PET Saúde Digital
          </p>
          <p className="text-[11px] text-white/70 mt-1 truncate">{EVENTO.instituicao}</p>
        </div>
        <InscricaoCTA className="hidden sm:inline-flex" />
      </div>

      {/* Menu de abas — navegação principal da SPA. Trocar de aba apenas
          atualiza o estado `abaAtiva`; nenhuma rolagem de página ocorre. */}
      <nav className="border-t border-white/10 bg-pet-blueDark/40">
        <div className="max-w-5xl mx-auto px-2 flex gap-1 overflow-x-auto tabs-scroll">
          {ABAS.map((aba) => (
            <button
              key={aba.id}
              onClick={() => setAbaAtiva(aba.id)}
              className={`flex-none px-3.5 py-2.5 text-sm font-medium border-b-2 transition-colors ${
                abaAtiva === aba.id
                  ? "border-pet-orange text-white"
                  : "border-transparent text-white/70 hover:text-white"
              }`}
            >
              {aba.label}
            </button>
          ))}
        </div>
      </nav>
    </header>
  );
}

/* ============================================================================
   RODAPÉ — logo da instituição promotora (UEPA) + faixa de inscrição mobile
   ============================================================================ */

function Footer() {
  return (
    <footer className="bg-pet-blueDark text-white mt-10">
      <div className="max-w-5xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-lg bg-white/10 grid place-items-center text-xs font-bold">
            UEPA
          </div>
          <div className="text-xs text-white/70 leading-snug">
            Realização<br />
            <span className="text-white font-medium">Universidade do Estado do Pará</span>
          </div>
        </div>
        <p className="text-xs text-white/50 text-center sm:text-right">
          {EVENTO.nome} · {EVENTO.data} · {EVENTO.local}
        </p>
      </div>
    </footer>
  );
}

/* ============================================================================
   APP — estado principal da SPA (aba ativa)
   ============================================================================ */

function App() {
  const [abaAtiva, setAbaAtiva] = useState("sobre");

  // Renderização condicional: só o componente da aba ativa é montado.
  // É essa troca que substitui a rolagem longa por navegação instantânea.
  const conteudoPorAba = {
    sobre: <About />,
    programacao: <Schedule />,
    palestrantes: <Speakers />,
    submissao: <Submissions />,
    local: <Location />,
    patrocinadores: <Sponsors />,
    contato: <Contact />,
  };

  return (
    <div className="min-h-screen flex flex-col bg-pet-ice">
      <Header abaAtiva={abaAtiva} setAbaAtiva={setAbaAtiva} />

      <main className="flex-1 w-full px-4 py-6 sm:py-8">
        {conteudoPorAba[abaAtiva]}
      </main>

      <Footer />

      {/* CTA de inscrição fixa no mobile — a divulgação principal é via
          WhatsApp, então o botão precisa estar sempre acessível sem rolar. */}
      <div className="sm:hidden sticky bottom-0 z-20 bg-white border-t border-slate-200 p-3">
        <InscricaoCTA className="w-full justify-center" />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
